name: state-base
kind: core
version: 0.3.0
subsystem: state
rung: instruction
rent:
  class: amplifier
addresses:
  - cold-start
provides:
  - AGENTS.md.d/30-state.md
  - .rein/state/PROGRESS.md
  - .rein/state/DEBT.md
seeds:
  - .rein/state/PROGRESS.md
  - .rein/state/DEBT.md
requires: []
conflicts: []
description: >
  Cross-session state: a progress file (read at session start, written
  at session end) and a debt ledger for known-broken things that are
  recorded rather than gated. Both are seeds — installed once,
  agent-owned after. Use always. Do NOT use for task tracking that
  lives in an external tracker.
