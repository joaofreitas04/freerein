description: >
  The harness improvement loop: nominate one candidate from the
  observe substrates, propose through rein with a pre-named
  measurement, change, measure, verdict on evidence. Use when the
  harness should get better or smaller without a failure driving it.
  Do NOT use to repair an observed failure — that is rein-diagnose.
