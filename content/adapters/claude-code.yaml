name: claude-code
version: 0.1.0
instruction_file:
  path: CLAUDE.md
  imports: true
  max_bytes: 32768
skills:
  dir: .claude/skills
  frontmatter: claude
  user_invoked_flag: disable-model-invocation
hooks:
  events: [PreToolUse, PostToolUse, SessionStart, PreCompact, Stop]
  post_compaction_reinjection: true
settings:
  path: .claude/settings.json
  permissions: true
state_dir: .rein/state
degradations: []
