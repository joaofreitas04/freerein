# Serve the committed registry/ directory at the Pages URL, verbatim.
#
# The registry's content decisions live in rein-publish (deterministic
# archives, version-bump refusal) and in review of the committed diff;
# this workflow only ships bytes. It deliberately runs no generation
# step — generated-at-deploy content would bypass the review that the
# committed-directory model exists to force.
name: registry

on:
  push:
    branches: [main]
    paths: ['registry/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: registry-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: registry/
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
